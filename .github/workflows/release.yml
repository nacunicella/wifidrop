name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./build.sh "${GITHUB_REF_NAME}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - run: gradle -p android assembleDebug --no-daemon -PappVersionName="${GITHUB_REF_NAME#v}"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/wifidrop-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
