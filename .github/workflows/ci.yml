name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Escritorio (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: ./build.sh "${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: wifidrop-desktop
          path: dist/

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - run: gradle -p android assembleDebug --no-daemon
      - run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/wifidrop-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wifidrop-android
          path: out/wifidrop-android.apk

  latest:
    name: Publicar release "latest"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Mover la etiqueta "latest" a este commit
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión (main)
          prerelease: true
          body: |
            Compilación automática del último commit en `main`.

            - **Android**: `wifidrop-android.apk`
            - **Windows**: `wifidrop-windows-amd64.exe`
            - **macOS**: `wifidrop-darwin-arm64` (Apple Silicon) o `wifidrop-darwin-amd64` (Intel)
            - **Linux**: `wifidrop-linux-amd64`
          files: dist/*
